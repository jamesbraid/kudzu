# Hardware definitions for pcibr. Edit here; gen/ is generated from this file.
unit = "pcibr"
prefix = "PCIBR"
title = "PCI bridge widget identification and window layouts"
doc = "PCI bridge widget identification word, configuration address layout and interrupt address registers."
from = "shipped IRIX kernel binaries, per docs/ip35-pcibr-registers.md"
public_from = ["shipped IRIX"]

[c]
legacy_header = "PCIBR_DECODE.h"
legacy_guard = "PCIBR_DECODE_H"

[words.WID]
width = 32
grade = "established"
doc = "The widget identification word."

[words.WID.fields.part]
bits = [27, 12]
grade = "established"

[words.WID.fields.part.enums]
layout32 = { value = 49154, grade = "established" }
layout32b = { value = 53250, grade = "established" }
layout64b = { value = 53506, grade = "established" }
layout64bx = { value = 53522, grade = "established" }
layout64a = { value = 57344, grade = "established" }
layout64ax = { value = 57360, grade = "established" }

[words.WID.fields.field11]
bits = [11, 1]
grade = "established"

[words.WID.fields.field11.enums]
value36 = { value = 36, grade = "established" }
value54 = { value = 54, grade = "established" }

[constants]
CFG_FUNC_SHIFT = { value = 0x8, grade = "established", doc = "function shifted left by this" }
CFG_SLOTS_32 = { value = 0x8, grade = "established", doc = "slots 0 to 7 on the 32-bit layout" }
CFG_SLOT_BIAS_64 = { value = 0x1, grade = "established", doc = "on the 64-bit layouts the slot is incremented before use; the accepted range is then 1 to 4" }
CFG_SLOT_SHIFT = { value = 0xc, grade = "established", doc = "configuration address is window plus slot shifted left by this" }
CFG_WINDOW32_OFFSET = { value = 0x20000, grade = "established", doc = "added on the 32-bit layout only, with the register offset first rounded down to a multiple of four" }
INTR_ADDR32_HI = { value = 0x11, grade = "established", doc = "the 32-bit layout replaces bits 17:8 of the word" }
INTR_ADDR32_LO = { value = 0x8, grade = "established" }
INTR_ADDR32_OFFSET = { value = 0x134, grade = "established", doc = "first interrupt address register, 32-bit layout; a 32-bit word" }
INTR_ADDR32_SRC_HI = { value = 0x2f, grade = "established", doc = "the 32-bit layout keeps source address bits 47:38" }
INTR_ADDR32_SRC_LO = { value = 0x26, grade = "established" }
INTR_ADDR64_OFFSET = { value = 0x130, grade = "established", doc = "first interrupt address register, 64-bit layouts; its low 48 bits hold the address" }
INTR_COUNT = { value = 0x8, grade = "established", doc = "interrupt numbers 0 to 7" }
INTR_STRIDE = { value = 0x8, grade = "established", doc = "byte stride of the interrupt address registers on every layout" }
WID_OFFSET = { value = 0x4, grade = "established", doc = "byte offset of the widget identification word in the window" }
WINDOW_BIT_A = { value = 0x3f, grade = "established" }
WINDOW_BIT_B = { value = 0x3c, grade = "established" }
WINDOW_BIT_C = { value = 0x39, grade = "established" }
