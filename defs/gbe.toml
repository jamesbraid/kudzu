# Hardware definitions for gbe. Edit here; gen/ is generated from this file.
unit = "gbe"
prefix = "GBE"
title = "O2 GBE register block as the O2 kernel drives it: two-wire buses, flat-panel timing words and the dual-channel option probe"
doc = "Register offsets, packed timing words and option-probe constants that the O2 kernel writes on the GBE block."
from = "shipped IRIX kernel binaries, per docs/gbe.md"
public_from = ["shipped IRIX"]

[registers.vt_vblank]
offset = 0x10010
access = "w"
width = 32
grade = "established"
doc = "Vertical blank word. The timing routine stores it in the interlace case and when no dual-channel option is fitted, packing the active height and 0xfff. Other stores to this offset are outside what this unit records."
[registers.vt_vblank.fields]
hi = { bits = [23, 12], grade = "established", doc = "active height" }
lo = { bits = [11, 0], grade = "established", doc = "0xfff in the interlace case" }

[registers.vt_hblank]
offset = 0x10014
access = "w"
width = 32
grade = "established"
doc = "Horizontal blank word. The timing routine stores it in the interlace case and when no dual-channel option is fitted, packing the active width and 0xfff. Other stores to this offset are outside what this unit records."
[registers.vt_hblank.fields]
hi = { bits = [23, 12], grade = "established", doc = "active width" }
lo = { bits = [11, 0], grade = "established", doc = "0xfff in the interlace case" }

[registers.timing_flags]
offset = 0x10018
access = "rw"
width = 32
grade = "established"
doc = "Timing flag word. The timing routine reads it, clears bits 1 and 7, and ORs in a value of 0 or 2 for the byte 132 set-up. What bit 1 does to the hardware is unknown. The value is undefined when the option lookup that feeds it fails."

[registers.fp_hdrv]
offset = 0x10028
access = "w"
width = 32
grade = "established"
doc = "Flat-panel horizontal drive word. The value depends on the board's panel set-up byte and on whether a dual-channel option is fitted. The table of values is in docs/gbe.md."
[registers.fp_hdrv.fields]
hi = { bits = [23, 12], grade = "established", doc = "12-bit field; its meaning is unknown" }
lo = { bits = [11, 0], grade = "established", doc = "12-bit field; its meaning is unknown" }

[registers.fp_vdrv]
offset = 0x1002c
access = "w"
width = 32
grade = "established"
doc = "Flat-panel vertical drive word. The value depends on the panel set-up byte and on the option, as the table in docs/gbe.md gives."
[registers.fp_vdrv.fields]
hi = { bits = [23, 12], grade = "established", doc = "12-bit field; its meaning is unknown" }
lo = { bits = [11, 0], grade = "established", doc = "12-bit field; its meaning is unknown" }

[registers.fp_de]
offset = 0x10030
access = "w"
width = 32
grade = "established"
doc = "Flat-panel data-enable word. The timing routine writes it only for the default set-up and panel set-ups 130 and 131, and only when no dual-channel option is fitted. It is not written otherwise."
[registers.fp_de.fields]
hi = { bits = [23, 12], grade = "established", doc = "12-bit field; its meaning is unknown" }
lo = { bits = [11, 0], grade = "established", doc = "12-bit field; its meaning is unknown" }

[constants]
TWO_WIRE_FP_OFF = { value = 0x10, grade = "established", doc = "Register offset of the flat-panel two-wire bus. Bus selector 1 drives it." }
TWO_WIRE_MON_OFF = { value = 0x8, grade = "established", doc = "Register offset of the monitor two-wire bus. Every other bus selector drives it." }
TWO_WIRE_WAIT_BIT = { value = 1, grade = "established", doc = "Bit of the bus register that a start condition waits to read clear." }
TWO_WIRE_WAIT_LIMIT = { value = 60, grade = "established", doc = "Most delays a start condition polls the bus bit before it gives up." }
OPT_PORT_ADDR = { value = 0x7e, grade = "established", doc = "Write address of the option port on the flat-panel bus. A read uses the same address with bit 0 set." }
OPT_CMD_ID_HIGH = { value = 0xff, grade = "established", doc = "Command written before the first id read. Its id bits come from bits 6 and 5 of the byte read." }
OPT_CMD_ID_LOW = { value = 0x7f, grade = "established", doc = "Command written before the second id read. Its id bits come from bits 6 and 5 of the byte read." }
OPT_ID_MASK = { value = 0x60, grade = "established", doc = "Bits 6 and 5 of an id read." }
OPT_ID_RESTORE = { value = 0x70, grade = "established", doc = "Bits ORed into the first byte read when the probe writes that byte back." }
OPT_CMD_CLOCK_KHZ = { value = 100000, grade = "established", doc = "Pixel clock in kHz. Above this the timing routine sends 0xff to the option port; at or below it, 0x7f." }
OPT_INSTALLED_LIMIT = { value = 9, grade = "established", doc = "Installed values below this use the small horizontal delay. The reason for the split is inferred." }
OPT_DELAY_SMALL = { value = 2, grade = "established", doc = "Horizontal delay used when the installed value is below the limit. It is zero otherwise." }
FIELD_SHIFT = { value = 12, grade = "established", doc = "Bit position of the high 12-bit field in the packed timing words." }
FIELD_MASK = { value = 0xfff, grade = "established", doc = "Mask applied to each 12-bit field before it is shifted or stored." }
BOARD_INTERLACE_OFF = { value = 45, grade = "established", doc = "Board description byte that selects the interlace case when non-zero. The layout of the board description is not established here." }
BOARD_PANEL_OFF = { value = 46, grade = "established", doc = "Board description byte that selects a flat-panel set-up." }
PANEL_SETUP_A = { value = 130, grade = "established", doc = "Panel set-up byte: fixed values for the first panel." }
PANEL_SETUP_B = { value = 131, grade = "established", doc = "Panel set-up byte: fixed values for the second panel." }
PANEL_SETUP_C = { value = 132, grade = "established", doc = "Panel set-up byte: fixed horizontal value, and the timing flag rewrite." }
