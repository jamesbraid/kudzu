# Hardware definitions for gbe. Edit here; gen/ is generated from this file.
unit = "gbe"
prefix = "GBE"
title = "O2 GBE register block as the O2 kernel drives it: two-wire buses, flat-panel timing words and the dual-channel option probe"
doc = "Register offsets, packed timing words and option-probe constants that the O2 kernel writes on the GBE block."
from = "shipped IRIX kernel binaries, per docs/gbe.md"
public_from = ["shipped IRIX"]

[registers.vt_vblank]
offset = 0x10010
access = "w"
width = 32
grade = "established"
doc = "Vertical blank word. The timing routine stores it in the interlace case and when no dual-channel option is fitted, packing the active height and 0xfff. Other stores to this offset are outside what this unit records."
[registers.vt_vblank.fields]
hi = { bits = [23, 12], grade = "established", doc = "active height" }
lo = { bits = [11, 0], grade = "established", doc = "0xfff in the interlace case" }

[registers.vt_hblank]
offset = 0x10014
access = "w"
width = 32
grade = "established"
doc = "Horizontal blank word. The timing routine stores it in the interlace case and when no dual-channel option is fitted, packing the active width and 0xfff. Other stores to this offset are outside what this unit records."
[registers.vt_hblank.fields]
hi = { bits = [23, 12], grade = "established", doc = "active width" }
lo = { bits = [11, 0], grade = "established", doc = "0xfff in the interlace case" }

[registers.timing_flags]
offset = 0x10018
access = "rw"
width = 32
grade = "established"
doc = "Timing flag word. The timing routine reads it, clears bits 1 and 7, and ORs in a value of 0 or 2 for the byte 132 set-up. What bit 1 does to the hardware is unknown. The value is undefined when the option lookup that feeds it fails."

[registers.fp_hdrv]
offset = 0x10028
access = "w"
width = 32
grade = "established"
doc = "Flat-panel horizontal drive word. The value depends on the board's panel set-up byte and on whether a dual-channel option is fitted. The table of values is in docs/gbe.md."
[registers.fp_hdrv.fields]
hi = { bits = [23, 12], grade = "established", doc = "12-bit field; its meaning is unknown" }
lo = { bits = [11, 0], grade = "established", doc = "12-bit field; its meaning is unknown" }

[registers.fp_vdrv]
offset = 0x1002c
access = "w"
width = 32
grade = "established"
doc = "Flat-panel vertical drive word. The value depends on the panel set-up byte and on the option, as the table in docs/gbe.md gives."
[registers.fp_vdrv.fields]
hi = { bits = [23, 12], grade = "established", doc = "12-bit field; its meaning is unknown" }
lo = { bits = [11, 0], grade = "established", doc = "12-bit field; its meaning is unknown" }

[registers.fp_de]
offset = 0x10030
access = "w"
width = 32
grade = "established"
doc = "Flat-panel data-enable word. The timing routine writes it only for the default set-up and panel set-ups 130 and 131, and only when no dual-channel option is fitted. It is not written otherwise."
[registers.fp_de.fields]
hi = { bits = [23, 12], grade = "established", doc = "12-bit field; its meaning is unknown" }
lo = { bits = [11, 0], grade = "established", doc = "12-bit field; its meaning is unknown" }

[registers.dotclk]
offset = 0x04
access = "rw"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Dot-clock (PLL) word. The timing routine clears the run bit, writes the timing words, then writes this word with the run bit set and waits 11 milliseconds. The coefficient fields hold M minus one, N minus one and P, as the kernel stores them."
[registers.dotclk.fields]
pll_m = { bits = [7, 0], grade = "established", doc = "PLL multiplier M, stored as M minus one" }
pll_n = { bits = [13, 8], grade = "established", doc = "PLL divider N, stored as N minus one" }
pll_p = { bits = [15, 14], grade = "established", doc = "PLL post-divider P, stored unchanged" }
run = { bits = [20, 20], grade = "established", doc = "cleared before a new value and set with it; what it does in the hardware is inferred (see DOTCLK_RUN_BIT)" }

[registers.vt_xy]
offset = 0x10000
access = "rw"
width = 32
grade = "inferred"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Vertical timing position word, called VT_0 in the reading. The start-up sequence compares its whole unmasked value with the vertical blank start line, and the stop sequence freezes it with the value in VT_XY_FREEZE. The offset follows from the VT_n numbering of the other timing words; the reading does not state it directly."

[registers.vt_1]
offset = 0x10004
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Frame totals. The timing routine writes 0 here, and the start-up sequence writes the totals once the frame buffer is set up. The kernel stores the record's total pixels and total lines, not one less than them; whether the hardware expects one less is unknown."
[registers.vt_1.fields]
total_pixels = { bits = [11, 0], grade = "established", doc = "total pixels per line, as stored" }
total_lines = { bits = [23, 12], grade = "established", doc = "total lines per frame, as stored" }

[registers.vt_2]
offset = 0x10008
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Vertical sync position, in lines."
[registers.vt_2.fields]
vsync_end = { bits = [11, 0], grade = "established", doc = "line where vertical sync ends" }
vsync_start = { bits = [23, 12], grade = "established", doc = "line where vertical sync starts" }

[registers.vt_3]
offset = 0x1000c
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Horizontal sync position, in pixels."
[registers.vt_3.fields]
hsync_end = { bits = [11, 0], grade = "established", doc = "pixel where horizontal sync ends" }
hsync_start = { bits = [23, 12], grade = "established", doc = "pixel where horizontal sync starts" }

[registers.vt_7]
offset = 0x1001c
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Vertical blank start line in the high field. The low field repeats it when the frame-lock flag bits of the timing record (mask 0x12) are set, and holds 0xfff otherwise."
[registers.vt_7.fields]
blank_start = { bits = [23, 12], grade = "established", doc = "vertical blank start line" }
low = { bits = [11, 0], grade = "established", doc = "the blank start line when a frame-lock flag is set, else 0xfff" }

[registers.vt_13]
offset = 0x10034
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Parked holding 0xffffff before the frame buffer is set up and written last in the start-up sequence. The final value is ((active width + v - 2) mod total pixels) in the low field and v in the high field, where v is the horizontal blank end minus 0x13, with total pixels added first when that is negative."

[registers.vt_14]
offset = 0x10038
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Parked holding 0xffffff and written last in the start-up sequence with the vertical blank start in the low field and the vertical blank end in the high field."

[registers.vt_15]
offset = 0x1003c
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Horizontal blank window, in pixels."
[registers.vt_15.fields]
hblank_end = { bits = [11, 0], grade = "established", doc = "pixel where horizontal blank ends" }
hblank_start = { bits = [23, 12], grade = "established", doc = "pixel where horizontal blank starts" }

[registers.vt_16]
offset = 0x10040
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Vertical blank window, in lines."
[registers.vt_16.fields]
vblank_end = { bits = [11, 0], grade = "established", doc = "line where vertical blank ends" }
vblank_start = { bits = [23, 12], grade = "established", doc = "line where vertical blank starts" }

[registers.vt_17]
offset = 0x10044
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Two parts, with bit placement not stated in the reading. The vertical part is minus (vertical blank start minus vertical blank end minus 1) when that difference is positive, else the difference, masked to 12 bits. The horizontal part is the horizontal blank end minus 20, with total pixels added when the blank end is below 20."

[registers.vt_18]
offset = 0x10048
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "The vertical part of VT_17 and the horizontal blank end minus 54, with total pixels added when that is negative, then 0x1000 added for one line. The reading gives the 54 as a kernel constant. The 0x1000 step places the line part in bits 23:12 (inferred), so the horizontal part is in bits 11:0 (inferred)."

[registers.vt_19]
offset = 0x1004c
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "The vertical part of VT_17 without the extra line that VT_18 adds, and the horizontal blank end minus 4. Bit placement is inferred as for VT_18."

[registers.frm_readback]
offset = 0x30008
access = "r"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Live readback of the frame control. The start-up sequence polls bit 0 until it equals bit 0 of the value it has just written to the frame control."

[registers.ovr_readback]
offset = 0x20004
access = "r"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Live readback of the overlay control. The start-up sequence polls bit 0 until it equals bit 0 of the value it has just written to the overlay control."

[registers.device_id]
offset = 0x14
access = "r"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Identity word the kernel reads first. It accepts the block only when the word reads 0x666; any other value means the kernel leaves the block untouched."

[registers.frm_control]
offset = 0x3000c
access = "rw"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Frame-buffer scan-out control. The stop routine saves it, clears its enable bit, and later writes it back with its pointer field bumped by one unit. The pointer field starts at bit 5 (inferred)."
[registers.frm_control.fields]
enable = { bits = [0, 0], grade = "established", doc = "cleared by the stop routine; the meaning as a DMA enable is inferred" }

[registers.ovr_control]
offset = 0x20008
access = "rw"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Overlay control. The stop routine clears its enable bit and leaves the word otherwise unwritten."
[registers.ovr_control.fields]
enable = { bits = [0, 0], grade = "established", doc = "cleared by the stop routine; the meaning as a DMA enable is inferred" }

[registers.did_control]
offset = 0x40004
access = "rw"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Display-ID table control. The stop routine clears its enable bit and leaves the word otherwise unwritten."
[registers.did_control.fields]
enable = { bits = [16, 16], grade = "established", doc = "cleared by the stop routine; the stop routine also tests it at entry" }

[registers.wid]
offset = 0x48000
access = "w"
width = 32
count = 32
stride = 4
grade = "established"
from = "shipped IRIX X display module, per docs/gbe.md"
doc = "Window-ID table, one 32-bit word per window index. Indices of 32 or more are rejected by the kernel. The kernel writes entry 0 with 3 at text-port set-up."
[registers.wid.fields]
buf = { bits = [1, 0], grade = "inferred", doc = "buffer code: 3 buffers both, 0 marks the window to be skipped by the buffer flip, 1 and 2 exchange on a swap. The bit position is inferred from the table values." }
type = { bits = [4, 2], grade = "inferred", doc = "pixel type: 0 indexed 8-bit, 1 indexed 12-bit, 2 RG3B2, 4 RGB5, 5 RGB8. The bit position is inferred from the table values and the compare mask." }
map_group = { bits = [9, 5], grade = "inferred", doc = "colour-map group; the group's first entry is this value times 256. The bit position is inferred from the table values." }
gamma_disable = { bits = [10, 10], grade = "established", doc = "gamma disable. The kernel clears it before a write when the alternative gamma table is in use." }

[registers.cursor_pos]
offset = 0x70000
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Hardware cursor position word. The text port writes 0 at set-up."

[registers.cursor_ctrl]
offset = 0x70004
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Cursor control word. The text port writes 1 after the glyph and colours are loaded. What the bits mean beyond that is unknown."

[registers.cursor_color1]
offset = 0x70008
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Cursor colour 1 in the byte layout red, green, blue, zero. The text port writes 0xffffff00."

[registers.cursor_color2]
offset = 0x7000c
access = "w"
width = 32
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Cursor colour 2 in the byte layout red, green, blue, zero. The text port writes 0xff000000."

[registers.cursor_glyph]
offset = 0x78000
access = "w"
width = 32
count = 64
stride = 4
grade = "established"
from = "shipped IRIX kernel binaries, per docs/gbe.md"
doc = "Cursor bitmap, 64 words. The text port loads words 0 to 31 from a 32-word table and writes 0 to words 32 to 63. Reading the words as a 32 by 32 bitmap at two bits per pixel is inferred; the text port draws with the first 32 words only (inferred)."

[constants]
DEVICE_ID_VALUE = { value = 0x666, grade = "established", doc = "Value the identity word at offset 0x14 must read for the kernel to accept the block" }
VT_XY_FREEZE = { value = 0x80000000, grade = "established", doc = "Value the kernel writes to the vertical timing position word to freeze it; the word's bit 31 is read first as the freeze state" }
DOTCLK_RUN_BIT = { value = 20, grade = "inferred", doc = "Bit of the dot-clock word that the kernel clears before a new value and sets with it. Inferred to run the PLL or its output; the specification leaves it undefined." }
DOTCLK_SETTLE_MS = { value = 11, grade = "established", doc = "Milliseconds the kernel waits after it writes the dot-clock word with the run bit set" }
REF_CLOCK_KHZ = { value = 20000, grade = "inferred", doc = "PLL reference clock behind the dot-clock table. The kernel states none; the source reading takes 20 MHz from a public Linux driver, not re-checked here." }
CMFIFO_MASK = { value = 0x3f, grade = "established", doc = "Colour-map FIFO occupancy field, bits 5:0. The register that holds it is not recorded here." }
CMFIFO_FREE_MIN = { value = 48, grade = "established", doc = "Free colour-map FIFO entries the X module waits for after each batch of 33 writes" }
CMFIFO_BATCH = { value = 33, grade = "established", doc = "Colour-map writes the X module issues between FIFO checks" }
CMAP_ENTRY_BASE = { value = 0x50000, grade = "established", doc = "Colour-map entry i is the word at this offset plus 4 times i; the word is red << 24 | green << 16 | blue << 8" }
TILE_NUMBER_MASK = { value = 0x1fff, grade = "established", doc = "Mask the kernel applies to a physical tile address before it is written into a tile list" }
DID_TABLE_BYTES = { value = 0x10000, grade = "established", doc = "Size of one display-ID table as the X module fills it. The frame table starts at byte 0 and the line tables start at DID_LINE_TABLE_OFFSET." }
DID_LINE_TABLE_OFFSET = { value = 0x2000, grade = "established", doc = "Byte offset of the first line table in a display-ID table" }
DID_BLOCK_BYTES = { value = 0x200, grade = "established", doc = "Size of one block of a display-ID table; line tables are packed in 16-bit units inside a block" }
DID_BLOCK_ENTRIES = { value = 256, grade = "established", doc = "Entries after which packing restarts in the next block" }
DID_END_BLOCK = { value = 128, grade = "established", doc = "Block number that ends a display-ID table; the X module stops filling it there" }
DID_LAST_XEND = { value = 2047, grade = "established", doc = "Right-hand column of the last band's line entry, which covers every line below the screen" }
GBE_LINE_IRQ_BASE = { value = 16, grade = "established", doc = "CRIME interrupt bit of GBE line 0; GBE line n raises bit 16 + n. Lines 2 and 3 are the CRIME inputs 18 and 19." }
TWO_WIRE_FP_OFF ={ value = 0x10, grade = "established", doc = "Register offset of the flat-panel two-wire bus. Bus selector 1 drives it." }
TWO_WIRE_MON_OFF = { value = 0x8, grade = "established", doc = "Register offset of the monitor two-wire bus. Every other bus selector drives it." }
TWO_WIRE_WAIT_BIT = { value = 1, grade = "established", doc = "Bit of the bus register that a start condition waits to read clear." }
TWO_WIRE_WAIT_LIMIT = { value = 60, grade = "established", doc = "Most delays a start condition polls the bus bit before it gives up." }
OPT_PORT_ADDR = { value = 0x7e, grade = "established", doc = "Write address of the option port on the flat-panel bus. A read uses the same address with bit 0 set." }
OPT_CMD_ID_HIGH = { value = 0xff, grade = "established", doc = "Command written before the first id read. Its id bits come from bits 6 and 5 of the byte read." }
OPT_CMD_ID_LOW = { value = 0x7f, grade = "established", doc = "Command written before the second id read. Its id bits come from bits 6 and 5 of the byte read." }
OPT_ID_MASK = { value = 0x60, grade = "established", doc = "Bits 6 and 5 of an id read." }
OPT_ID_RESTORE = { value = 0x70, grade = "established", doc = "Bits ORed into the first byte read when the probe writes that byte back." }
OPT_CMD_CLOCK_KHZ = { value = 100000, grade = "established", doc = "Pixel clock in kHz. Above this the timing routine sends 0xff to the option port; at or below it, 0x7f." }
OPT_INSTALLED_LIMIT = { value = 9, grade = "established", doc = "Installed values below this use the small horizontal delay. The reason for the split is inferred." }
OPT_DELAY_SMALL = { value = 2, grade = "established", doc = "Horizontal delay used when the installed value is below the limit. It is zero otherwise." }
FIELD_SHIFT = { value = 12, grade = "established", doc = "Bit position of the high 12-bit field in the packed timing words." }
FIELD_MASK = { value = 0xfff, grade = "established", doc = "Mask applied to each 12-bit field before it is shifted or stored." }
BOARD_INTERLACE_OFF = { value = 45, grade = "established", doc = "Board description byte that selects the interlace case when non-zero. The layout of the board description is not established here." }
BOARD_PANEL_OFF = { value = 46, grade = "established", doc = "Board description byte that selects a flat-panel set-up." }
PANEL_SETUP_A = { value = 130, grade = "established", doc = "Panel set-up byte: fixed values for the first panel." }
PANEL_SETUP_B = { value = 131, grade = "established", doc = "Panel set-up byte: fixed values for the second panel." }
PANEL_SETUP_C = { value = 132, grade = "established", doc = "Panel set-up byte: fixed horizontal value, and the timing flag rewrite." }
