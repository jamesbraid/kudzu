# Hardware definitions for hubmdb. Edit here; gen/ is generated from this file.
unit = "hubmdb"
prefix = "HUBMDB"
title = "Origin 300 hub memory-directory migration registers"
doc = "Origin 300 hub memory-directory migration registers."
from = "shipped IRIX kernel binaries, per docs/page-migration.md"
public_from = ["shipped IRIX"]

[c]
legacy_header = "HUBMDB_DECODE.h"
legacy_guard = "HUBMDB_DECODE_H"

[registers.mig_diff_thresh]
offset = 0x40
access = "w"
width = 64
grade = "established"
doc = """
The mode control sits in a different window of the hub, not in the block
above: its offset is the local register base of the public vendor header
subtracted from the address the notes record. No shipped kernel reads or
writes it, so only the offset is stated. See MIG_CONFIG_LOCAL_OFFSET.
"""

[registers.mig_diff_thresh.fields]
value = { bits = [14, 0], grade = "inferred" }

[constants]
MIG_CANDIDATE_CLR_OFFSET = { value = 0x38, grade = "unknown", doc = "access and width; the public vendor header names it the read-to-clear candidate register, no shipped kernel accesses it" }
MIG_CANDIDATE_OFFSET = { value = 0x30, grade = "unknown", doc = "access and width; named only by a public vendor header, no shipped kernel accesses it" }
MIG_CONFIG_LOCAL_OFFSET = { value = 0x780018, grade = "inferred", doc = "offset from the hub-local register base, by subtraction against a public vendor header; unknown: access, width and fields, no shipped kernel accesses it" }
MIG_DIFF_THRESH_VALID_BIT = { value = 0x3f, grade = "established", doc = "set to arm, cleared to disarm" }
MIG_VALUE_THRESH_OFFSET = { value = 0x48, grade = "unknown" }
NODE_SHIFT = { value = 0x21, grade = "established", doc = "physical node number shift" }
WINDOW_BASE_UNITS = { value = 0x1fc, grade = "established", doc = "physical base of the block for node 0, in units of 1 << HUBMDB_WINDOW_BASE_UNIT_SHIFT bytes; split because the full value is also a boot-region address the publish check refuses" }
WINDOW_BASE_UNIT_SHIFT = { value = 0x10, grade = "established" }
