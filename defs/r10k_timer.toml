# Hardware definitions for r10k_timer. Edit here; gen/ is generated from this file.
unit = "r10k_timer"
prefix = "R10K_TIMER"
title = "R10000 Count and Compare timer interrupt"
doc = "R10000 Count and Compare timer interrupt, from the published manual."
from = "published R10000 user's manual (the header gives no document number)"
public_from = ["published R10000"]

[c]
legacy_header = "R10K_TIMER_DECODE.h"
legacy_guard = "R10K_TIMER_DECODE_H"

[words.CAUSE]
width = 32
grade = "established"

[words.CAUSE.fields]
ip7 = { bits = [15, 15], grade = "established" }

[constants]
R10K_CP0_COMPARE = { value = 0xb, grade = "established", macro = "R10K_CP0_COMPARE", doc = "established: Compare register number in coprocessor 0" }
R10K_CP0_COUNT = { value = 0x9, grade = "established", macro = "R10K_CP0_COUNT", doc = "established: Count register number in coprocessor 0" }
