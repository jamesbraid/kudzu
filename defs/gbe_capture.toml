grade = "inferred"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Capture control words VC_0 to VC_8, as the reading names them. The reading gives the first and last word offsets, 0x80000 and 0x80020, so the 4-byte stride is inferred. The reading established that VC_0 to VC_3 are written as zero when a capture path stops. Its word width is inferred from the word-sized copies the start-up makes. VC_2 bit 0 enables DMA and VC_3 holds a path byte, both inferred from the start routine."
