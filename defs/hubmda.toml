# Hardware definitions for hubmda. Edit here; gen/ is generated from this file.
unit = "hubmda"
prefix = "HUBMDA"
title = "Origin 200/2000 hub memory-directory migration registers"
doc = "Origin 200/2000 hub memory-directory migration registers."
from = "shipped IRIX kernel binaries"
public_from = ["shipped IRIX"]

[c]
legacy_header = "HUBMDA_DECODE.h"
legacy_guard = "HUBMDA_DECODE_H"

[registers.mig_diff_thresh]
offset = 0x30
access = "rw"
width = 64
grade = "established"
doc = "Bit 63 is the valid bit: set when the kernel arms the threshold, cleared to disarm it while a candidate is handled. See MIG_DIFF_THRESH_VALID_BIT."

[registers.mig_diff_thresh.fields]
value = { bits = [19, 0], grade = "inferred" }

[registers.mig_value_thresh]
offset = 0x38
access = "rw"
width = 64
grade = "inferred"
doc = "Bit 63 is the valid bit, set to arm and cleared to disarm. See MIG_VALUE_THRESH_VALID_BIT."

[registers.mig_candidate]
offset = 0x48
access = "r"
width = 64
grade = "established"
doc = """
Read-to-clear alias of the candidate register. The kernel reads it in a loop
until the valid bit (bit 63) is clear. The public Linux hub header calls 0x40
the candidate register and 0x48 its read-to-clear alias. The kernel reads only
0x48, so this is that alias; that a read consumes the candidate is inferred
from the name and the loop. Nothing accesses 0x40. See MIG_CANDIDATE_VALID_BIT.
"""

[registers.mig_candidate.fields]
type = { bits = [30, 30], grade = "inferred" }
node = { bits = [28, 20], grade = "inferred" }
page = { bits = [17, 0], grade = "inferred" }

[constants]
MIG_CANDIDATE_VALID_BIT = { value = 0x3f, grade = "established", doc = "the loop ends when it is clear" }
MIG_DIFF_THRESH_VALID_BIT = { value = 0x3f, grade = "established", doc = "set to arm, cleared to disarm" }
MIG_VALUE_THRESH_VALID_BIT = { value = 0x3f, grade = "established", doc = "set to arm, cleared to disarm" }
NODE_SHIFT = { value = 0x20, grade = "established", doc = "physical node number shift" }
REFCNT_COUNT_MASK_PREMIUM = { value = 0x7ffff, grade = "established", doc = "nineteen bits, premium memory; which memory is premium is inferred" }
REFCNT_COUNT_MASK_STANDARD = { value = 0x7ff, grade = "established", doc = "eleven bits, standard memory" }
REFCNT_COUNT_SHIFT = { value = 0x5, grade = "established" }
REFCNT_NODE_STRIDE = { value = 0x8, grade = "established", doc = "bytes between the words of consecutive nodes for one page" }
WINDOW_BASE = { value = 0x1a00000, grade = "established", doc = "physical base of the block for node 0" }
