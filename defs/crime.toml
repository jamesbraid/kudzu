# Hardware definitions for crime. Edit here; gen/ is generated from this file.
unit = "crime"
prefix = "CRIME"
title = "O2 CRIME as the shipped IRIX kernel and graphics libraries drive it: identity, interrupt inputs, renderer state and TLB formats"
doc = "Offsets, identity values, interrupt inputs and renderer field layouts that the O2 kernel, OpenGL library and X server use on the CRIME block. Prose and the reasoning are in docs/crime.md."
from = "shipped IRIX O2 graphics objects, per docs/crime.md"
public_from = ["shipped IRIX O2 graphics objects, per docs/crime.md", "CRIME 1.5 specification, rev 0.3 (1997)", "GBE ASIC specification, rev 1.1 (1996)"]

[registers.id]
offset = 0x0
access = "r"
width = 8
grade = "established"
doc = "Identity byte at the start of the CRIME block. The graphics probe reads its low byte and accepts the part only when bits 7:4 are the accepted family and the byte is not the refused value."
[registers.id.fields]
family = { bits = [7, 4], grade = "established", doc = "family nibble; the probe accepts 0xA" }

[registers.texture_format]
offset = 0x2118
access = "w"
width = 64
grade = "established"
doc = "Texture format record, written by the OpenGL library for each texture. It carries the log2 sizes of the texture and the coordinate masks. The width of the register is taken from the top field, which reaches bit 47."
[registers.texture_format.fields]
width_inv = { bits = [47, 44], grade = "established", doc = "10 minus log2 of the texture width" }
height_inv = { bits = [43, 40], grade = "established", doc = "10 minus log2 of the texture height" }
width_log2 = { bits = [39, 36], grade = "established", doc = "log2 of the texture width" }
height_log2 = { bits = [35, 32], grade = "established", doc = "log2 of the texture height" }
width_mask = { bits = [31, 16], grade = "established", doc = "(1 << (log2 width + 4)) - 1" }
height_mask = { bits = [15, 0], grade = "established", doc = "(1 << (log2 height + 4)) - 1" }

[constants]
# Physical windows. The kernel probes the CRIME block; the other windows come
# from the CRIME specification's address map and are not seen in the binaries.
BLOCK_ADDR = { value = 0x14000000, grade = "established", doc = "Physical address of the CRIME block, as the graphics probe reads it" }
GBE_WINDOW_ADDR = { value = 0x16000000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF pages 47-52", doc = "CPU window the specification gives for the GBE block. Not confirmed by the binaries; the GBE page keeps the GBE block base as unknown" }
FRAME_APERTURE_ADDR = { value = 0x10000000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF pages 47-52", doc = "Frame-buffer aperture, 32 MiB" }
DEPTH_APERTURE_ADDR = { value = 0x12000000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF pages 47-52", doc = "Depth-buffer aperture, 32 MiB" }
MACE_WINDOW_ADDR = { value = 0x18000000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF pages 47-52", doc = "Start of the MACE window, which runs to 0x1fffffff" }
HIGH_ALIAS_ADDR = { value = 0x20000000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF pages 47-52", doc = "High alias of low memory, 512 MiB; the specification's table marks its responder with a question mark" }
FULL_MEM_ADDR = { value = 0x40000000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF pages 47-52", doc = "Full memory window, 1 GiB" }
NOECC_ALIAS_ADDR = { value = 0x80000000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF pages 47-52", doc = "No-ECC alias of memory, 1 GiB" }
ID_FAMILY_ACCEPTED = { value = 0xa, grade = "established", doc = "Value of bits 7:4 of the identity byte that the graphics probe accepts" }
ID_REFUSED_BYTE = { value = 0xa0, grade = "established", doc = "Identity byte the graphics probe refuses even though its family is accepted" }
ID_SPEC_15 = { value = 0xb1, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF page 114", doc = "Identity byte the specification gives for CRIME 1.5. The graphics probe refuses it" }

# CPU-interface registers, offsets from the block base.
CONTROL_OFF = { value = 0x08, grade = "established", doc = "CONTROL word; the early-reset code writes bits 13:12 and 9 of it" }
INTSTAT_OFF = { value = 0x10, grade = "established", doc = "Interrupt status word; the dispatcher reads its low 32 bits ANDed with the saved mask" }
INTMASK_OFF = { value = 0x18, grade = "established", doc = "Interrupt mask word; the entry path saves it and installs a per-priority mask" }
SOFTINT_OFF = { value = 0x20, grade = "inferred", from = "NetBSD sgimips names, read against the kernel's software-interrupt use", doc = "Software interrupt word, which raises inputs 28 and 29" }
INTR_EDGE_OFF = { value = 0x28, grade = "established", doc = "Interrupt edge word; the retrace and pre-blank handlers acknowledge by clearing bit 16 or 17 with a read-modify-write" }
WATCHDOG_OFF = { value = 0x30, grade = "established", doc = "Watchdog word; IRIX writes zero at start-up and never arms it" }
TIME_OFF = { value = 0x38, grade = "established", doc = "Free-running time counter; IRIX reads its low word" }
TIME_RESOLUTION = { value = 15000, grade = "established", doc = "Resolution IRIX states for the time counter. The unit is inferred to be picoseconds, a 66.67 MHz tick" }
CPU_ERR_STATUS_OFF = { value = 0x48, grade = "established", doc = "CPU error status; the capture routine clears it by writing zero" }
MEM_CTL_OFF = { value = 0x200, grade = "established", doc = "Memory control word; 1 enables and 0 disables. The kernel never writes its bank or refresh registers" }
MEM_ERR_STATUS_OFF = { value = 0x250, grade = "established", doc = "Memory error status; the capture routine clears it by writing zero" }
ENGINE_RESET_OFF = { value = 0x408, grade = "established", doc = "Engine reset word; the kernel writes zero, waits 10 microseconds and rewrites the interface-buffer control word, named IB_CTL in the reading. Whether IB_CTL is the word at RENDER_CTL_OFF is inferred. The reset role of this write is inferred" }
RENDER_STATUS_OFF = { value = 0x4000, grade = "established", doc = "Renderer interface-buffer status word" }
RENDER_CTL_OFF = { value = 0x400, grade = "established", doc = "Renderer interface-buffer control word: count, stall, empty and full thresholds" }
RENDER_FLUSH_OFF = { value = 0x4008, grade = "established", doc = "Written with zero after TLB loads, context switches and clip validation; the write discards entries after the start pointer" }
START_ALIAS_OFF = { value = 0x800, grade = "established", doc = "Added to a register's offset to make a write commit the primitive. The final write of each primitive uses the alias of whichever register is written last" }

# Interface-buffer control word, as the kernel writes it.
RENDER_CTL_INIT = { value = 0x0fefff0a, grade = "established", doc = "First value the kernel writes to the control word: full 127, empty 63, stall 126, count 10" }
RENDER_COUNT_INIT = { value = 10, grade = "established", doc = "Count field value in every control word the kernel writes" }
RENDER_STALL_SHIFT = { value = 7, grade = "established", doc = "Bit position of the stall field; each of the four fields is 7 bits wide" }
RENDER_EMPTY_SHIFT = { value = 14, grade = "established", doc = "Bit position of the empty field" }
RENDER_FULL_SHIFT = { value = 21, grade = "established", doc = "Bit position of the full field" }
RENDER_FIELD_MASK = { value = 0x7f, grade = "established", doc = "Mask for one 7-bit threshold field" }
RENDER_R10K_FULL = { value = 20, grade = "established", doc = "Full threshold the kernel writes for R10000-family and RM7000 modules" }
RENDER_R10K_EMPTY = { value = 0, grade = "established", doc = "Empty threshold for R10000-family and RM7000 modules" }
RENDER_R10K_STALL = { value = 19, grade = "established", doc = "Stall threshold for R10000-family and RM7000 modules" }
RENDER_R5K_FULL = { value = 48, grade = "established", doc = "Full threshold for the other R5000-class modules" }
RENDER_R5K_EMPTY = { value = 24, grade = "established", doc = "Empty threshold for the other R5000-class modules" }
RENDER_R5K_STALL = { value = 47, grade = "established", doc = "Stall threshold for the other R5000-class modules" }
RENDER_STATUS_IDLE_BIT = { value = 28, grade = "established", doc = "Idle bit of the renderer status word" }
RENDER_OCC_SHIFT = { value = 18, grade = "established", doc = "Bit position of the occupancy field of the status word, 7 bits wide" }
RENDER_START_MASK = { value = 0x3f, grade = "established", doc = "Start pointer in bits 5:0 of the status word, read during context save" }
RENDER_WPTR_SHIFT = { value = 6, grade = "established", doc = "Write pointer bit position in the status word, 6 bits wide" }
RENDER_FIFO_DEPTH = { value = 64, grade = "inferred", doc = "Interface-buffer depth. The kernel reports overflow above 64 and walks the buffer as a ring of 64; the specification prints 128-entry arrays" }

# Interrupt inputs.
IRQ_MACE_ISA_A = { value = 4, grade = "established", doc = "MACE ISA interrupt input; IRIX registers 4 or 5" }
IRQ_MACE_ISA_B = { value = 5, grade = "established", doc = "MACE ISA interrupt input; IRIX registers 4 or 5" }
IRQ_RETRACE = { value = 16, grade = "established", doc = "Vertical retrace, from GBE line 0" }
IRQ_PREBLANK = { value = 17, grade = "established", doc = "Pre-blank, from GBE line 1" }
IRQ_GBE_LINE_2 = { value = 18, grade = "established", doc = "GBE line 2; IRIX does not use it" }
IRQ_GBE_LINE_3 = { value = 19, grade = "established", doc = "GBE line 3; IRIX does not use it" }
IRQ_BUS_ERR_A = { value = 20, grade = "established", doc = "Bus-error input; one kernel handler serves this input and input 21. Which input the silicon raises for CPU errors is unknown" }
IRQ_BUS_ERR_B = { value = 21, grade = "established", doc = "Bus-error input; see IRQ_BUS_ERR_A" }
IRQ_FIFO_LOW = { value = 25, grade = "established", doc = "Renderer interface buffer at or below its empty level" }
IRQ_FIFO_HIGH = { value = 26, grade = "established", doc = "Renderer interface buffer above its full level" }
IRQ_SOFT_A = { value = 28, grade = "inferred", doc = "Software interrupt registered by IRIX at priority 1. Its role is inferred from the software-interrupt word" }
IRQ_SOFT_B = { value = 29, grade = "inferred", doc = "Software interrupt registered by IRIX at priority 2. Its role is inferred from the software-interrupt word" }
LINE_MATCH_LATCHES = { value = 4, grade = "inferred", from = "GBE ASIC specification, rev 1.1", doc = "Line-match interrupts that latch in CRIME; only software clears them there" }

# Texture, frame-buffer and linear TLBs.
FB_TLB_REGS = { value = 64, grade = "established", doc = "Registers in each frame-buffer TLB (A, B and C), each holding four 16-bit tile entries" }
TEX_TLB_REGS = { value = 28, grade = "established", doc = "Registers in the texture TLB, written as 28 doublewords on each texture bind" }
CID_TLB_REGS = { value = 4, grade = "established", doc = "Registers in the CID tile-list TLB, four 16-bit entries each" }
LIN_TLB_REGS = { value = 16, grade = "established", doc = "Registers in each linear TLB (A and B), two 32-bit entries each" }
LIN_TLB_MAX_PAGES = { value = 32, grade = "established", doc = "Most pages a pinned user buffer may have when it is loaded into a linear TLB" }
LIN_TLB_VALID = { value = 0x80000000, grade = "established", doc = "Bit ORed into each linear TLB entry; the page frame number is in the low bits" }
TEX_TILE_FLAG = { value = 0x8000, grade = "established", doc = "Bit ORed into each texture tile entry" }
TILE_PAGES = { value = 16, grade = "established", doc = "Page frames in one 64 KiB tile. The kernel maps tile entry v as frames v << 4 through (v << 4) + 15" }
PAGE_BYTES = { value = 4096, grade = "inferred", doc = "Size of a linear TLB page frame, from the frame numbering" }
TILE_BYTES = { value = 0x10000, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF page 186", doc = "Frame-buffer tile size; the kernel's 16-page mapping agrees with it" }
TILE_ROWS = { value = 128, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF page 186", doc = "Rows in one frame-buffer tile" }
TILE_ROW_BYTES = { value = 512, grade = "inferred", from = "CRIME 1.5 specification, rev 0.3, PDF page 186", doc = "Bytes in one row of a frame-buffer tile" }
TEX_MAX_TEXELS = { value = 1024, grade = "inferred", doc = "Largest texture dimension the format record leaves room for, from the coordinate scale" }

# Pixel pipeline register offsets (from the block base).
DRAWMODE_OFF = { value = 0x2018, grade = "established", doc = "DrawMode; bit 9 is logic-op enable, bit 8 dither, bit 14 hardware fog, bit 12 antialiasing" }
PRIMITIVE_OFF = { value = 0x2060, grade = "established", doc = "Primitive type and edge word" }
PIXPIPE_NULL_OFF = { value = 0x21f0, grade = "established", doc = "Null pixel-pipeline register, which the kernel treats as global" }
PIXFLUSH_OFF = { value = 0x21f8, grade = "established", doc = "Pixel-pipeline flush; a zero write, after which the library polls the idle bit" }
TEXTURE_MODE_OFF = { value = 0x2110, grade = "established", doc = "Texture mode: filter codes, wrap codes, environment function, level bits and the subtile flag" }
FOG_COLOR_OFF = { value = 0x2170, grade = "established", doc = "Fog colour, three 8-bit components in bits 31:8" }
AA_LINE_OFF = { value = 0x2190, grade = "established", doc = "Antialiased-line register: minor-axis slope in bits 31:16, start position with 8 fraction bits in bits 15:0" }
ALPHA_TEST_OFF = { value = 0x2198, grade = "established", doc = "Alpha-test register" }
BLEND_FUNC_OFF = { value = 0x21a8, grade = "established", doc = "Blend function register" }
LOGIC_OP_OFF = { value = 0x21b0, grade = "established", doc = "Logic operation, GL op minus GL_CLEAR, in 16 values" }
DEPTH_FUNC_OFF = { value = 0x21c0, grade = "established", doc = "Depth function in bits 27:25, a stencil-only flag in bit 24 and the clear depth in bits 23:0" }
STENCIL_MODE_OFF = { value = 0x21e0, grade = "established", doc = "Stencil mode: reference, value mask, function and three operations" }
STENCIL_MASK_OFF = { value = 0x21e8, grade = "established", doc = "Stencil write mask" }
PIXXFER_POS_OFF = { value = 0x20a0, grade = "established", doc = "Pixel-transfer screen position: x in bits 26:16, y in bits 10:0" }
PIXXFER_YSTEP_OFF = { value = 0x20ac, grade = "established", doc = "Pixel-transfer source Y step, written by an unbound caller as (zoom - 1) << 28 | (stride + pixel size - width)" }
PIXXFER_VTX_OFF = { value = 0x2070, grade = "established", doc = "16-bit X vertex form of pixel DMA, written by a caller bound to the engine" }
LINEAR_WINDOW_MASK = { value = 0x1ffff, grade = "established", doc = "Mask on the linear source address of a draw; the linear window is 128 KiB" }
PRIM_TRIANGLE = { value = 0x02000000, grade = "established", doc = "Primitive word for triangles; the edge number is ORed in at bit 16" }
PRIM_RECT = { value = 0x03020000, grade = "established", doc = "Primitive word for rectangles: depth clears and the X server's copies" }
VTX_TRI_BASE = { value = 0x48040000, grade = "established", doc = "Biased binary32 vertex word for triangles; each step adds 64 times the coordinate" }
VTX_DEPTH_BASE = { value = 0x00840000, grade = "established", doc = "Biased binary32 vertex word for depth clears; the same bias as triangles in bits 18:0" }
VTX_STEP = { value = 64, grade = "established", doc = "Scale applied to a coordinate before it is ORed into a vertex word" }
GL_VERTEX_BIAS = { value = 0x1000, grade = "established", doc = "Bias the library applies to GL vertex halves in pixel DMA" }
GL_UNBOUND_BIAS = { value = 0x21000, grade = "established", doc = "Bias the kernel removes from coordinates for a caller that is not bound to the engine" }
DMA_REQ_BYTES = { value = 0x28, grade = "established", doc = "Size of the kernel pixel-DMA request" }
DMA_POLL_LIMIT = { value = 500000, grade = "established", doc = "Polls the kernel makes for idle before the pixel DMA gives up" }
DMA_IOCTL = { value = 0x55f2, grade = "inferred", doc = "Request number of the kernel pixel-DMA ioctl" }

# Memory-to-memory engine (MTE) modes and blocks.
MTE_MODE_X_COPY = { value = 0x820, grade = "established", doc = "MTE mode the X server uses for a copy: copy, source TLB B, destination TLB A, 8-bit" }
MTE_MODE_HOST_CLEAR = { value = 0x11, grade = "established", doc = "Kernel host-memory clear: clear, linear A, destination ECC" }
MTE_MODE_HOST_COPY = { value = 0x897, grade = "established", doc = "Kernel host-memory copy: copy, linear A to linear B, both ECC bits" }
MTE_HOST_CHUNK_BYTES = { value = 0x20000, grade = "established", doc = "Largest chunk of a kernel host-memory clear or copy" }
MTE_X_BLOCK_BYTES = { value = 256, grade = "established", doc = "Width in bytes of the whole-row blocks the X server sends to the MTE" }
MTE_X_ROWS_16 = { value = 16, grade = "established", doc = "Rows in a block at 16 bits per pixel" }
MTE_X_ROWS_32 = { value = 8, grade = "established", doc = "Rows in a block at 32 bits per pixel" }

# Textures.
TEX_SUBTILE_BIT = { value = 24, grade = "established", doc = "Texture.mode bit that selects subtiled texels" }
TEX_TYPE_SHIFT = { value = 20, grade = "established", doc = "Bit position of the texel type code, 4 bits wide" }
TEX_LOG2_BYTES_SHIFT = { value = 18, grade = "established", doc = "Bit position of log2 bytes per texel, 2 bits wide" }
TEX_SUBTILE_CELL_BYTES = { value = 32, grade = "inferred", doc = "Cell size of a subtiled texture, from the library's address stepping" }

# Words that are not registers.
[words.IB_ADDR]
width = 64
grade = "established"
doc = "Interface-buffer address word, as the kernel decodes it in software. Bit 45 marks the stop entry."
[words.IB_ADDR.fields]
reg_index = { bits = [39, 32], grade = "established", doc = "Register index" }
group = { bits = [42, 40], grade = "established", doc = "Register group" }
lane = { bits = [44, 43], grade = "established", doc = "Lane code" }
stop = { bits = [45, 45], grade = "established", doc = "Stop marker, used by the kernel's decoder" }
