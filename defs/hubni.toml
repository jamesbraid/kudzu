# Hardware definitions for hubni. Edit here; gen/ is generated from this file.
unit = "hubni"
prefix = "HUBNI"
title = "node hub network interface registers"
doc = "Node hub network interface words: node number, link state, link reset and port error."
from = "shipped IRIX kernel binaries, per docs/ip35-hub-errors.md"
public_from = ["shipped IRIX"]

[c]
legacy_header = "HUBNI_DECODE.h"
legacy_guard = "HUBNI_DECODE_H"

[words.NSRI]
width = 32
grade = "established"
doc = "The low 32 bits of the Origin 200/2000 network status word."

[words.NSRI.fields]
nodeid = { bits = [16, 8], grade = "established" }

[constants]
O200_STATUS_OFFSET = { value = 0x600000, grade = "established", doc = "Origin 200/2000 network status word, carries the node number" }
O300_ERROR_CLEAR_OFFSET = { value = 0x680120, grade = "established", doc = "Origin 300 port error clear word; the kernel reads it, then stores zero to the error word; whether the read clears anything is unknown" }
O300_ERROR_LATCHED_HI = { value = 0x34, grade = "established", doc = "top bit of the range of latched error bits the kernel tests" }
O300_ERROR_LATCHED_LO = { value = 0x18, grade = "established", doc = "bottom bit of that range" }
O300_ERROR_LINK_RESET_BIT = { value = 0x34, grade = "established", doc = "link reset caused by another partition, with the enable word zero; that the chip latches it when a reset is refused is unknown" }
O300_ERROR_OFFSET = { value = 0x680100, grade = "established" }
O300_ERROR_REPORT_A_OFFSET = { value = 0x680108, grade = "established", doc = "read through the local alias and printed in the link error report; role unknown" }
O300_ERROR_REPORT_B_OFFSET = { value = 0x680110, grade = "established", doc = "as report word A" }
O300_ERROR_REPORT_C_OFFSET = { value = 0x680118, grade = "established", doc = "as report word A" }
O300_PORT_RESET_OFFSET = { value = 0x680008, grade = "established", doc = "Origin 300 port reset word; the kernel writes the value 6" }
O300_RESET_ENABLE_OFFSET = { value = 0x680010, grade = "established", doc = "Origin 300 reset enable word; the kernel writes 1; bit 0 is the one that matters (datasheet \"reset ok\" is inferred)" }
O300_STATUS_OFFSET = { value = 0x680000, grade = "established", doc = "Origin 300 network status word; bits 1:0 are tested as link state, bits 2:1 equal to 2 starts a link-reset wait" }
