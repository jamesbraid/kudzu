# Hardware definitions for nic. Edit here; gen/ is generated from this file.
unit = "nic"
prefix = "NIC"
title = "bit-serial access to the one-wire identity parts"
doc = "Bit-serial control word for the one-wire identity parts and the hub address that reaches the same bus."
from = "shipped IRIX kernel binaries, per docs/nic.md"
public_from = ["shipped IRIX"]

[c]
legacy_header = "NIC_DECODE.h"
legacy_guard = "NIC_DECODE_H"

[words.GPCR_S]
width = 32
doc = """
The I/O controller's general-purpose control word, written through its set
alias. Before reading the address part the routine stores 0x200000 to the
register address its caller passes, when that address is not null; with a
null address it prints that it is bypassing the enable and goes on. The word
is written whole, so bit 21 is the only bit the routine sets. That the store
enables the one-wire path to the part is read from the routine's own message,
and that a set alias leaves other bits alone is inferred from its name."""
grade = "inferred"

[words.GPCR_S.fields]
nic_enable = { bits = [21, 21], grade = "inferred" }

[words.MCR]
width = 32
grade = "established"
doc = "The 32-bit microlan control word."

[words.MCR.fields]
pulse = { bits = [10, 10], grade = "established" }
sample = { bits = [2, 2], grade = "established" }
done = { bits = [1, 1], grade = "established" }
result = { bits = [0, 0], grade = "established" }

[constants]
GPCR_S_NIC_ENABLE_WORD = { value = 0x200000, grade = "established", doc = "the value stored" }
HUB_ACCESS_NODE_SHIFT = { value = 0x21, grade = "established", doc = "node number shift" }
HUB_ACCESS_OFFSET = { value = 0xe04030, grade = "established", doc = "offset of the register from the hub's local-window base" }
HUB_ACCESS_PHYS_LOW = { value = 0x1e04030, grade = "established", doc = "physical address of the register for node 0" }
MAC_CRC16_RESIDUE = { value = 0xb001, grade = "established", doc = "CRC-16 residue over record bytes 1 to 13" }
MAC_ID_BYTE0 = { value = 0x8d, grade = "established", doc = "required value of record byte 0" }
MAC_ID_BYTE1 = { value = 0xa, grade = "established", doc = "required value of record byte 1" }
MAC_RECORD_LEN = { value = 0xe, grade = "established", doc = "bytes read from the part" }
