# Hardware definitions for mace_video_out. Edit here; gen/ is generated from this file.
unit = "mace_video_out"
prefix = "MACE_VIDEO_OUT"
title = "O2 MACE video output channel registers as the IRIX O2 video driver reaches them"
doc = "Register offsets, widths and the fields the reading could state for the output channel. Offsets are from the output channel base, which is a fixed displacement in the video window. Prose and the reasoning are in docs/mace-video.md."
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
public_from = ["shipped IRIX O2 video driver object, per docs/mace-video.md", "MACE 2.0 specification"]

[registers.out_control]
offset = 0x00
access = "rw"
width = 64
grade = "inferred"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Channel control word. The driver writes the whole word, changing only its low nine bits. The output recovery routines pulse bit 0. The reading read the routines that write it in a workspace and did not re-read them, so the grade is inferred."
[registers.out_control.fields]
dma_enable = { bits = [0, 0], grade = "inferred", doc = "DMA enable" }
intr_enable = { bits = [8, 1], grade = "inferred", doc = "Eight interrupt enables. Which cause each bit enables is not stated." }

[registers.out_status]
offset = 0x08
access = "r"
width = 64
grade = "inferred"
from = "MACE 2.0 specification, pages 36 and 37 as the reading cites them"
doc = "Status word. Reading it clears the pending interrupt causes. The output recovery routines read it after their last write and discard the value. The page numbers were not checked against the document."

[registers.out_config]
offset = 0x10
access = "rw"
width = 64
grade = "established"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Configuration word, written at start-up. Its field layout is not recorded here; the hardware configuration register at at 0x58 is a separate word."

[registers.out_next_descriptor]
offset = 0x18
access = "rw"
width = 64
grade = "inferred"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Physical address of the next descriptor block, held as a zero-extended 32-bit word. The recovery routines write it as well. Which bits carry the flag byte the driver ORs in is not stated."

[registers.out_field_offset]
offset = 0x20
access = "rw"
width = 64
grade = "inferred"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Field offset. The driver writes the low halfword of a transfer-record word here."
[registers.out_field_offset.fields]
offset = { bits = [15, 0], grade = "inferred", doc = "Field offset in the low halfword" }

[registers.out_field_size]
offset = 0x28
access = "rw"
width = 64
grade = "inferred"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Field size. The reading takes the line count and the bytes per line from one stored value, which it gives as 243 lines of 2880 bytes in one set and 288 lines in the other."
[registers.out_field_size.fields]
lines = { bits = [21, 12], grade = "inferred", doc = "Lines in the field" }
line_bytes = { bits = [11, 0], grade = "inferred", doc = "Bytes per line" }

[registers.out_h_pad_odd]
offset = 0x30
access = "rw"
width = 64
grade = "established"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Horizontal padding word for the odd field. The reading states it is a 64-bit value. Its layout is not recorded."

[registers.out_v_pad_odd]
offset = 0x38
access = "rw"
width = 64
grade = "established"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Vertical padding word for the odd field. The reading states it is a 64-bit value. Its layout is not recorded."

[registers.out_h_pad_even]
offset = 0x40
access = "rw"
width = 64
grade = "established"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Horizontal padding word for the even field. The reading states it is a 64-bit value. Its layout is not recorded."

[registers.out_v_pad_even]
offset = 0x48
access = "rw"
width = 64
grade = "established"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Vertical padding word for the even field. The reading states it is a 64-bit value. Its layout is not recorded."

[registers.out_genlock_delay]
offset = 0x50
access = "rw"
width = 64
grade = "established"
from = "shipped IRIX O2 video driver object, per docs/mace-video.md"
doc = "Genlock delay word, written at start-up with a 64-bit store. Its layout is not recorded."

[registers.out_hw_config]
offset = 0x58
access = "rw"
width = 64
grade = "inferred"
from = "MACE 2.0 specification layout, as the shipped IRIX O2 video driver object uses it, per docs/mace-video.md"
doc = "Hardware configuration word for the output channel: port reset and select bits, audio and genlock sync settings, the general-purpose output bit and the framelock start-of-field counts. Bits 4, 7 and 8 and the audio-sync reset bit are not assigned by the reading."
[registers.out_hw_config.fields]
port_ab_reset = { bits = [0, 0], grade = "inferred", doc = "Port AB reset. Released whenever an input or output is set up." }
port_ab_select = { bits = [1, 1], grade = "inferred", doc = "Port AB select" }
port_cd_reset = { bits = [2, 2], grade = "inferred", doc = "Port CD reset. Released whenever an input or output is set up." }
port_cd_select = { bits = [3, 3], grade = "inferred", doc = "Port CD select" }
audio_sync_source = { bits = [6, 5], grade = "inferred", doc = "Audio sync source" }
framelock_reset = { bits = [9, 9], grade = "inferred", doc = "GBE framelock reset" }
framelock_source = { bits = [11, 10], grade = "inferred", doc = "GBE framelock source" }
framelock_precision = { bits = [12, 12], grade = "inferred", doc = "GBE framelock precision" }
framelock_correction = { bits = [13, 13], grade = "inferred", doc = "GBE framelock correction" }
sof_count_odd = { bits = [17, 14], grade = "inferred", doc = "Start-of-field count for the odd field" }
general_output = { bits = [18, 18], grade = "inferred", doc = "General-purpose output bit" }
sof_count_even = { bits = [22, 19], grade = "inferred", doc = "Start-of-field count for the even field" }
ident = { bits = [35, 32], grade = "inferred", doc = "Identity read by the video probe. The value that identifies the part is not in the reading." }
