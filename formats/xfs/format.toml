[constants]
INO_ATTR_FORK_UNIT = { value = 0x8, grade = "established", doc = "forkoff counts units of this many bytes" }
INO_FLAGS_OFFSET = { value = 0x5a, grade = "established", doc = "the 16-bit flags word" }
INO_FORK_OFFSET = { value = 0x64, grade = "established", doc = "start of the data fork" }
INO_MAGIC = { value = 0x494e, grade = "established" }
INO_SIZE = { value = 0x64, grade = "established" }
SB_DESCRIBED_BYTES = { value = 0xcc, grade = "established", doc = "the format debugger names fields up to this end" }
SB_LEN_FNAME = { value = 0x6, grade = "established" }
SB_LEN_FPACK = { value = 0x6, grade = "established" }
SB_LEN_UUID = { value = 0x10, grade = "established" }
SB_MAGIC = { value = 0x58465342, grade = "established", doc = "bytes 58 46 53 42" }
SB_OFF_FNAME = { value = 0x6c, grade = "established", doc = "volume name, first half" }
SB_OFF_FPACK = { value = 0x72, grade = "established", doc = "volume name, second half; fname and fpack form one 12-byte name" }
SB_OFF_UUID = { value = 0x20, grade = "established", doc = "opaque bytes" }
SB_READ_BYTES = { value = 0xd0, grade = "established", doc = "bytes the kernel copies into its in-core superblock" }
SB_SIZE = { value = 0xd0, grade = "established" }
