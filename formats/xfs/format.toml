# Hardware definitions for xfs. Edit here; generated/ and format.md are generated from this file.
unit = "xfs"
prefix = "XFS"
title = "XFS superblock and inode core as the shipped release writes them"
doc = "XFS superblock and inode core as the shipped release writes them."
from = "shipped IRIX binaries, per formats/xfs/README.md"
public_from = ["shipped IRIX"]

[words.INO_W0]
width = 32
grade = "established"

[words.INO_W0.fields]
magic = { bits = [31, 16], grade = "established" }
mode = { bits = [15, 0], grade = "established" }

[[words.INO_W0.tests]]
value = 0x494e41ed
kind = "example"
expect = { magic = 18766, mode = 16877 }

