# Hardware definitions for efs. Edit here; generated/ and format.md are generated from this file.
unit = "efs"
prefix = "EFS"
title = "Extent File System on-disk structures"
doc = "Extent File System on-disk structures: superblock, inode, extent and directory block."
from = "shipped IRIX binaries, per formats/efs/README.md"
public_from = ["shipped IRIX"]

[words.DB_W0]
width = 32
grade = "established"

[words.DB_W0.fields]
magic = { bits = [31, 16], grade = "established" }
firstused = { bits = [15, 8], grade = "established" }
slots = { bits = [7, 0], grade = "established" }

[[words.DB_W0.tests]]
value = 0xbeef0300
kind = "example"
expect = { magic = 48879, firstused = 3, slots = 0 }

