[constants]
BBSIZE = { value = 0x200, grade = "established", doc = "block size in bytes" }
BITMAP_BB = { value = 0x2, grade = "established", doc = "bitmap start when the superblock bitmap block is 0" }
DB_SIZE = { value = 0x200, grade = "established" }
DENT_HEADER_BYTES = { value = 0x5, grade = "established", doc = "inode number plus name length byte" }
DEV_LONG_FORM = { value = 0xffff, grade = "established", doc = "short device value that selects the long form" }
DIRBLK_HEADERSIZE = { value = 0x4, grade = "established" }
DIRBLK_MAGIC = { value = 0xbeef, grade = "established" }
DIRBLK_MAXSLOTS = { value = 0x48, grade = "established" }
DIRECTEXTENTS = { value = 0xc, grade = "established", doc = "extents that fit in the inode data area" }
DI_SIZE = { value = 0x80, grade = "established" }
EXT_SIZE = { value = 0x8, grade = "established" }
EX_MAXLEN = { value = 0xf8, grade = "established", doc = "longest run in blocks" }
INODES_PER_BB = { value = 0x4, grade = "established" }
INODE_DATA_BYTES = { value = 0x60, grade = "established", doc = "inode data area, from byte 0x20 to 0x7f" }
