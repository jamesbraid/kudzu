MAGIC_NEW = { value = 0x7295a, grade = "established", doc = "bitmap and size placed past the last group" }
MAGIC_OLD = { value = 0x72959, grade = "established", doc = "carried by every held image" }
ROOT_INO = { value = 0x2, grade = "established", doc = "inodes 0 and 1 are never allocated" }
SB_LEN_FNAME = { value = 0x6, grade = "established" }
SB_LEN_FPACK = { value = 0x6, grade = "established" }
SB_LEN_SPARE = { value = 0x14, grade = "inferred" }
