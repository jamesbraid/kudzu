# Hardware definitions for xlv. Edit here; generated/ and format.md are generated from this file.
unit = "xlv"
prefix = "XLV"
title = "XLV logical volume manager on-disk label structures"
doc = "XLV logical volume manager on-disk label: master block, label slot header and per-partition entry."
from = "shipped IRIX binaries, per formats/xlv/README.md"
public_from = ["shipped IRIX"]

[words.E_W0]
width = 32
grade = "established"

[words.E_W0.fields]
vol_flags = { bits = [31, 0], grade = "established" }

[words.E_W25]
width = 32
grade = "unknown"

[words.E_W25.fields]
sv_flags_hi_no_err_retry = { bits = [31, 31], grade = "established" }
sv_flags_hi_other = { bits = [30, 16], grade = "unknown" }
sv_flags_hi_low = { bits = [15, 0], grade = "established" }

[[words.E_W25.tests]]
value = 0x80000000
expect = { sv_flags_hi_no_err_retry = 1, sv_flags_hi_other = 0, sv_flags_hi_low = 0 }

[words.E_W27]
width = 32
grade = "established"

[words.E_W27.fields]
