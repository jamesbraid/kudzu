# Hardware definitions for nic_record. Edit here; generated/ and format.md are generated from this file.
unit = "nic_record"
prefix = "NIC"
title = "Ethernet address record the IRIX kernel reads from a one-wire part"
doc = "Software table, not a register map: the layout the kernel checks in the record it reads from the one-wire part on an Ethernet controller. The one-wire access registers are described in the chips repository."
from = "shipped IRIX kernel binaries, per docs/nic.md"
public_from = ["shipped IRIX"]

[constants]
MAC_CRC16_RESIDUE = { value = 0xb001, grade = "established", doc = "CRC-16 residue over record bytes 1 to 13" }
MAC_ID_BYTE0 = { value = 0x8d, grade = "established", doc = "required value of record byte 0" }
MAC_ID_BYTE1 = { value = 0xa, grade = "established", doc = "required value of record byte 1" }
MAC_RECORD_LEN = { value = 0xe, grade = "established", doc = "bytes read from the part" }
